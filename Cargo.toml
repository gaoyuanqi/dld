[package]
name = "dld"
version = "0.1.1"
description = "Q宠大乐斗个人版代玩辅助"
authors = ["雨园"]
license = "MIT"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.6", features = ["derive", "unicode"] }
directories = "6"
encoding_rs = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
